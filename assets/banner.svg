<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Informalidad y Distribucion de Riqueza: modelo de agentes heterogeneos en tiempo continuo, verificado en Lean 4">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#16233d"/>
    </linearGradient>
    <linearGradient id="formal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="informal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dens" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="260" rx="3" fill="url(#dens)"/>

  <!-- Titulo -->
  <text x="44" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">
    Informalidad y Distribución de Riqueza
  </text>
  <text x="44" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">
    Agentes heterogéneos en tiempo continuo · oferta laboral endógena · dos sectores
  </text>
  <text x="44" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">
    Perú · calibración ENAHO · MATLAB + Lean 4
  </text>

  <!-- Pastilla de verificacion -->
  <g transform="translate(44,176)">
    <rect x="0" y="0" width="286" height="42" rx="21" fill="#0f2a24" stroke="#2dd4bf" stroke-width="1.4"/>
    <path d="M18 21 l7 8 l13 -17" fill="none" stroke="#2dd4bf" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="27" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#a7f3d0">
      16 teoremas probados, sin huecos
    </text>
  </g>

  <!-- Esquema: dos sectores hacia la distribucion -->
  <g transform="translate(690,42)">
    <rect x="0" y="18" width="128" height="52" rx="9" fill="none" stroke="url(#formal)" stroke-width="2"/>
    <text x="64" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5eead4">Formal</text>
    <text x="64" y="60" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5eead4" opacity="0.75">CRS · capital</text>

    <rect x="0" y="96" width="128" height="52" rx="9" fill="none" stroke="url(#informal)" stroke-width="2"/>
    <text x="64" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#fbbf24">Informal</text>
    <text x="64" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#fbbf24" opacity="0.75">DRS · barrera κ(z)</text>

    <path d="M128 44 C 162 44, 168 74, 196 83" fill="none" stroke="#2dd4bf" stroke-width="1.8" opacity="0.85"/>
    <path d="M128 122 C 162 122, 168 92, 196 83" fill="none" stroke="#f59e0b" stroke-width="1.8" opacity="0.85"/>

    <!-- Densidad de riqueza -->
    <path d="M204 150 C 232 150, 240 44, 276 44 C 316 44, 322 132, 356 143 C 386 152, 400 150, 420 150"
          fill="none" stroke="url(#dens)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M204 150 C 232 150, 240 44, 276 44 C 316 44, 322 132, 356 143 C 386 152, 400 150, 420 150 L 420 152 L 204 152 Z"
          fill="url(#dens)" opacity="0.14"/>
    <line x1="204" y1="152" x2="424" y2="152" stroke="#334155" stroke-width="1.4"/>
    <text x="314" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">
      distribución estacionaria de riqueza
    </text>
  </g>
</svg>
